# 原生 Google DoH、校园 ECS 与教育 IPv6 白名单 DNS 策略。
# 依赖 sysu-openwrt-aaaa.conf，加载时应位于其后。
[YAML]
dns!:
  enable: true
  ipv6: true
  enhanced-mode: redir-host
  listen: 0.0.0.0:7874
  respect-rules: false
  nameserver:
  - https://8.8.8.8/dns-query#♻️ 所有-自动选择&disable-ipv6=true
  - https://8.8.4.4/dns-query#♻️ 所有-自动选择&disable-ipv6=true
  default-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  - https://[2400:3200::1]/dns-query#DIRECT&name-cert-verify=dns.alidns.com
  use-hosts: true
  nameserver-policy:
    "+.taile946ce.ts.net":
    - 100.100.100.100
    rule-set:sysu-openwrt-aaaa:
    - https://223.5.5.5/dns-query#DIRECT
    - https://223.6.6.6/dns-query#DIRECT
    - https://[2400:3200::1]/dns-query#DIRECT&name-cert-verify=dns.alidns.com
    - https://doh.pub/dns-query#DIRECT
    rule-set:native-google-ecs-direct:
    - https://8.8.8.8/dns-query#♻️ 所有-自动选择&ecs=120.236.174.0/24&ecs-override=true&disable-ipv6=true
    - https://8.8.4.4/dns-query#♻️ 所有-自动选择&ecs=120.236.174.0/24&ecs-override=true&disable-ipv6=true
  prefer-h3: false
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  - https://223.6.6.6/dns-query#DIRECT
  - https://[2400:3200::1]/dns-query#DIRECT&name-cert-verify=dns.alidns.com
  - https://doh.pub/dns-query#DIRECT
  proxy-server-nameserver-policy: {}
  direct-nameserver:
  - https://8.8.8.8/dns-query#♻️ 所有-自动选择&ecs=120.236.174.0/24&ecs-override=true&disable-ipv6=true
  - https://8.8.4.4/dns-query#♻️ 所有-自动选择&ecs=120.236.174.0/24&ecs-override=true&disable-ipv6=true
  direct-nameserver-follow-policy: true
hosts:
  doh.pub:
  - 1.12.12.12
  - 120.53.53.53
  dns.alidns.com:
  - 223.5.5.5
  - 223.6.6.6
  - 2400:3200::1

[Overwrite]
ruby_edit "$CONFIG_FILE" "['rule-providers']['native-google-ecs-direct']" "(begin; direct_targets = ['DIRECT'] + Value['proxy-groups'].select { |g| g['proxies'] == ['DIRECT'] }.map { |g| g['name'] }; reject_targets = ['REJECT', 'REJECT-DROP'] + Value['proxy-groups'].select { |g| (g['proxies'] || []).include?('REJECT') }.map { |g| g['name'] }; domains = Value['rules'].map { |r| r.split(',') }.select { |r| ['DOMAIN', 'DOMAIN-SUFFIX', 'DOMAIN-KEYWORD'].include?(r.first) }; direct = ['GEOSITE,cn'] + domains.select { |r| direct_targets.include?(r.take('3'.to_i).last) }.map { |r| r.first('2'.to_i).join(',') }; proxy = domains.reject { |r| direct_targets.include?(r.take('3'.to_i).last) || reject_targets.include?(r.take('3'.to_i).last) }.map { |r| r.first('2'.to_i).join(',') }; yes = 'OR,(' + direct.uniq.map { |r| '(' + r + ')' }.join(',') + ')'; no = 'OR,(' + proxy.uniq.map { |r| '(' + r + ')' }.join(',') + ')'; payload = proxy.empty? ? yes : 'AND,((' + yes + '),(NOT,((' + no + '))))'; {'type'=>'inline', 'behavior'=>'classical', 'payload'=>[payload]}; end)"
