dns:
  ipv6: true
  nameserver!:
    - '10.8.8.8#disable-ipv6=true'
    - '10.8.4.4#disable-ipv6=true'
  nameserver-policy!:
    'rule-set:sysu-openwrt-aaaa':
      - '10.8.8.8'
      - '10.8.4.4'

